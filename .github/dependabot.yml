version: 2

# Every week, check each folder's packages for updates and known vulnerabilities.
updates:
  - package-ecosystem: "npm"
    directory: "/client"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/server"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/ai-service"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/e2e-tests"
    schedule:
      interval: "weekly"
