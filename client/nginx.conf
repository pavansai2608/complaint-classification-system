server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Helmet already covers the API (server/src/app.js); these are the same
    # protections for the page itself, which only this web server can set.
    # 'always' so they're sent on error responses too, not just 2xx.
    #
    # script-src/frame-src/connect-src include accounts.google.com because
    # Google Sign-In (client/src/pages/Login.jsx) loads its script and
    # embedded button from there. style-src needs 'unsafe-inline' because
    # the app uses inline styles, plus fonts.googleapis.com for the Inter
    # font (theme.css) and accounts.google.com for the Sign-In button's own
    # stylesheet - without these two the font silently falls back to a
    # system font and the Google button fails to render properly. font-src
    # covers fonts.gstatic.com, which is where the actual font files those
    # Google Fonts stylesheets point to are hosted.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://accounts.google.com https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://accounts.google.com; frame-src https://accounts.google.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Only takes effect once the site is actually served over HTTPS.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Mirrors the Vite dev proxy: the browser only ever talks to this
    # origin, and API calls are forwarded to the server container.
    location /api/ {
        proxy_pass http://server:4000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # React Router handles unknown paths client-side, so anything that
    # isn't a real file falls back to index.html instead of a 404.
    location / {
        try_files $uri /index.html;
    }
}
