server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Mirrors the Vite dev proxy: the browser only ever talks to this
    # origin, and API calls are forwarded to the server container.
    location /api/ {
        proxy_pass http://server:4000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # React Router handles unknown paths client-side, so anything that
    # isn't a real file falls back to index.html instead of a 404.
    location / {
        try_files $uri /index.html;
    }
}
