# Render Blueprint: the client and the server, both on the free plan.
#
# MongoDB is not here - Render has no MongoDB, so the database is a free
# MongoDB Atlas cluster and MONGODB_URI points at it.
#
# The ai-service runs here too, on the free plan, with EMOTION_BACKEND=api:
# the DistilBERT sentiment model needs PyTorch and about 1.5 GB of memory, and
# free instances have 512 MB, so Hugging Face's Inference API runs the same
# model instead. The category model (scikit-learn) still runs here.
#
# Every value marked `sync: false` is asked for once, when the Blueprint is
# first created in the Render dashboard. Secrets never go in this file.
services:
  # The React app, served from Render's CDN. The browser only ever talks to
  # this one address: /api/* is forwarded to the server below, the same job
  # nginx does in Docker and Kubernetes. That keeps the refresh-token cookie
  # first-party, so login works without changing any cookie settings.
  - type: web
    name: complaint-triage-web
    runtime: static
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      # Baked into the bundle at build time by Vite. A Google OAuth Client ID
      # is public by design (it is sent to every browser), so it is not a
      # secret - but it lives in the dashboard, not in git, like the others.
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
    routes:
      # Order matters: the API rule has to come before the catch-all.
      # If Render gave the server a different address than the one below
      # (it adds a suffix when the name is taken), change it here.
      - type: rewrite
        source: /api/*
        destination: https://complaint-triage-server-jvl8.onrender.com/api/*
      # Single-page app: every other path is index.html, React Router takes over.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # The same protections client/nginx.conf sets for the page itself.
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://accounts.google.com https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://accounts.google.com; frame-src https://accounts.google.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      # Hashed file names never change content, so cache them for good.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

  # The Express API. Render sets PORT itself and server.js already reads it.
  - type: web
    name: complaint-triage-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci --omit=dev
    startCommand: node src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Turns on the Secure flag on the refresh-token cookie.
      - key: NODE_ENV
        value: production
      # Atlas connection string, e.g. mongodb+srv://USER:PASSWORD@cluster0.xxxxx.mongodb.net/complaint_system
      - key: MONGODB_URI
        sync: false
      # The web address above, with https:// and no trailing slash,
      # e.g. https://complaint-triage-web-jvl8.onrender.com
      - key: CLIENT_ORIGIN
        sync: false
      # Render makes up long random values for these two, different from each other.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRES
        value: 15m
      - key: REFRESH_TOKEN_EXPIRES
        value: 7d
      - key: GOOGLE_CLIENT_ID
        sync: false
      # The ai-service's public address, e.g. https://complaint-triage-ai-xxxx.onrender.com
      # (free services can't receive private-network calls, so it is the public one).
      - key: AI_SERVICE_URL
        sync: false
      # Same value as on the ai-service, which generates it.
      - key: AI_SERVICE_KEY
        fromService:
          type: web
          name: complaint-triage-ai
          envVarKey: AI_SERVICE_KEY
      # A sleeping free ai-service takes a while to wake. The customer waits for
      # this call when submitting, so cap it at 30 s; if it runs out, the
      # complaint is still saved with a default priority.
      - key: AI_SERVICE_TIMEOUT_MS
        value: "30000"

  # The FastAPI ai-service: category, sentiment, priority and suggested reply.
  # Only the server calls it, with the shared AI_SERVICE_KEY.
  - type: web
    name: complaint-triage-ai
    runtime: python
    plan: free
    rootDir: ai-service
    buildCommand: pip install -r requirements-light.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: PYTHONPATH
        value: src/main/python
      # Sentiment from the DistilBERT model via Hugging Face (word list if it fails).
      - key: EMOTION_BACKEND
        value: api
      # Hugging Face token with the "Make calls to Inference Providers" permission.
      - key: HF_TOKEN
        sync: false
      # Render makes up a long random value; the server reads the same one.
      - key: AI_SERVICE_KEY
        generateValue: true
      # From https://aistudio.google.com/apikey - writes the suggested replies.
      - key: GEMINI_API_KEY
        sync: false
      # Optional fallback for suggested replies, from https://console.groq.com/keys
      - key: GROQ_API_KEY
        sync: false
      # The same Atlas database as the server, to find similar past complaints.
      - key: MONGODB_URI
        fromService:
          type: web
          name: complaint-triage-server
          envVarKey: MONGODB_URI
