# Render Blueprint: the client and the server, both on the free plan.
#
# MongoDB is not here - Render has no MongoDB, so the database is a free
# MongoDB Atlas cluster and MONGODB_URI points at it.
#
# The ai-service is not here either. It loads PyTorch and a DistilBERT model,
# which needs about 1.5 GB of memory; Render's free instances have 512 MB, so
# it would be killed on start. Without it the server still works: it saves each
# complaint with a default priority (see server/src/services/aiService.js).
# README "Run on Render" explains how to add it on a paid instance.
#
# Every value marked `sync: false` is asked for once, when the Blueprint is
# first created in the Render dashboard. Secrets never go in this file.
services:
  # The React app, served from Render's CDN. The browser only ever talks to
  # this one address: /api/* is forwarded to the server below, the same job
  # nginx does in Docker and Kubernetes. That keeps the refresh-token cookie
  # first-party, so login works without changing any cookie settings.
  - type: web
    name: complaint-triage-web
    runtime: static
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      # Baked into the bundle at build time by Vite. A Google OAuth Client ID
      # is public by design (it is sent to every browser), so it is not a
      # secret - but it lives in the dashboard, not in git, like the others.
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
    routes:
      # Order matters: the API rule has to come before the catch-all.
      # If Render gave the server a different address than the one below
      # (it adds a suffix when the name is taken), change it here.
      - type: rewrite
        source: /api/*
        destination: https://complaint-triage-server-jvl8.onrender.com/api/*
      # Single-page app: every other path is index.html, React Router takes over.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # The same protections client/nginx.conf sets for the page itself.
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://accounts.google.com https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://accounts.google.com; frame-src https://accounts.google.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      # Hashed file names never change content, so cache them for good.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

  # The Express API. Render sets PORT itself and server.js already reads it.
  - type: web
    name: complaint-triage-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci --omit=dev
    startCommand: node src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Turns on the Secure flag on the refresh-token cookie.
      - key: NODE_ENV
        value: production
      # Atlas connection string, e.g. mongodb+srv://USER:PASSWORD@cluster0.xxxxx.mongodb.net/complaint_system
      - key: MONGODB_URI
        sync: false
      # The web address above, with https:// and no trailing slash,
      # e.g. https://complaint-triage-web-jvl8.onrender.com
      - key: CLIENT_ORIGIN
        sync: false
      # Render makes up long random values for these two, different from each other.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRES
        value: 15m
      - key: REFRESH_TOKEN_EXPIRES
        value: 7d
      - key: GOOGLE_CLIENT_ID
        sync: false
      # Leave these two empty to run without the ai-service.
      - key: AI_SERVICE_URL
        sync: false
      - key: AI_SERVICE_KEY
        sync: false
      - key: AI_SERVICE_TIMEOUT_MS
        value: "5000"
