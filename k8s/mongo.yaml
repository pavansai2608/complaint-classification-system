apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongo-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      containers:
        - name: mongo
          image: mongo:7
          ports:
            - containerPort: 27017
          # ClusterIP keeps this off the LAN, but any pod inside the cluster
          # can still reach it - the ai-service pod handles untrusted
          # complaint text, so it must not be able to read/write the whole
          # database with zero credentials if it's ever compromised.
          env:
            # Root exists only to bootstrap the database and create the two
            # scoped users below. Neither app ever uses this credential.
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: complaint-server-secrets
                  key: MONGO_ROOT_USERNAME
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: complaint-server-secrets
                  key: MONGO_ROOT_PASSWORD
            # Read by create-users.js on first startup.
            - name: MONGO_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: complaint-server-secrets
                  key: MONGO_APP_PASSWORD
            - name: MONGO_AI_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: complaint-server-secrets
                  key: MONGO_AI_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /data/db
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: 27017
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 27017
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mongo-data
        - name: init
          configMap:
            name: mongo-init
---
# No ClusterIP needed - Deployments reach Mongo by this Service's DNS name,
# not from outside the cluster, so this is intentionally not exposed further.
apiVersion: v1
kind: Service
metadata:
  name: mongo
spec:
  selector:
    app: mongo
  ports:
    - port: 27017
      targetPort: 27017
