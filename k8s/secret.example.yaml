# Template only - copy to secret.yaml and fill in real values.
# secret.yaml is gitignored and must never be committed.
#
#   cp k8s/secret.example.yaml k8s/secret.yaml
#   # edit k8s/secret.yaml with real values
#   kubectl apply -f k8s/secret.yaml
#
# Split in two so each pod only gets the credentials it actually needs.
# The ai-service handles untrusted complaint text, so it must not hold the
# JWT keys (which would let a compromise forge admin tokens) and gets a
# read-only database user rather than one that can write.
apiVersion: v1
kind: Secret
metadata:
  name: complaint-server-secrets
type: Opaque
stringData:
  # Mongo's root user. Used only to bootstrap the database and create the
  # two scoped users below - no application ever connects with it.
  # openssl rand -hex 24
  MONGO_ROOT_USERNAME: mongo_root
  MONGO_ROOT_PASSWORD: changeme

  # Passwords for the scoped users created by k8s/mongo-init.yaml.
  MONGO_APP_PASSWORD: changeme
  MONGO_AI_PASSWORD: changeme

  # The server connects as complaint_app (readWrite on complaint_system).
  # Password must match MONGO_APP_PASSWORD above.
  MONGODB_URI: "mongodb://complaint_app:changeme@mongo:27017/complaint_system"

  # Must be long random strings, different from each other.
  # node -e "console.log(require('crypto').randomBytes(48).toString('hex'))"
  JWT_ACCESS_SECRET: changeme
  JWT_REFRESH_SECRET: changeme

  # Shared secret the server sends as X-Service-Key to the ai-service.
  # Must match the same value in complaint-ai-secrets below.
  # openssl rand -hex 32
  AI_SERVICE_KEY: changeme
---
apiVersion: v1
kind: Secret
metadata:
  name: complaint-ai-secrets
type: Opaque
stringData:
  # The ai-service connects as complaint_ai, which can only READ
  # complaint_system - it just looks up similar past complaints to ground
  # its suggested replies. Password must match MONGO_AI_PASSWORD above.
  MONGODB_URI: "mongodb://complaint_ai:changeme@mongo:27017/complaint_system"

  # Must match AI_SERVICE_KEY in complaint-server-secrets above.
  AI_SERVICE_KEY: changeme

  # Gemini free tier API key, from https://aistudio.google.com/apikey
  GEMINI_API_KEY: changeme
