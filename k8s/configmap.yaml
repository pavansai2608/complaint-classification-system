apiVersion: v1
kind: ConfigMap
metadata:
  name: complaint-config
data:
  # server
  PORT: "4000"
  CLIENT_ORIGIN: "http://complaint.local"
  # MONGODB_URI now carries credentials, so it lives in the Secret instead.
  AI_SERVICE_URL: "http://ai-service:8000"
  # Higher than the 5s used for local dev: in the cluster the ai-service is
  # CPU-limited and also calls Gemini, so a full analysis takes ~10-15s.
  # Timing out early would silently drop every complaint into the
  # "analysis pending" fallback path.
  AI_SERVICE_TIMEOUT_MS: "25000"
  ACCESS_TOKEN_EXPIRES: "15m"
  REFRESH_TOKEN_EXPIRES: "7d"
  # Client ID is a public identifier (verifies a token Google already
  # signed), so it's config, not a secret. Same value the client is built
  # with as VITE_GOOGLE_CLIENT_ID.
  GOOGLE_CLIENT_ID: "your-client-id.apps.googleusercontent.com"

  # ai-service
  ENABLE_DOCS: "false"
