# Ingress for the EC2/k3s deployment - reachable via the nip.io hostname
# that maps to the instance's Elastic IP, with a real Let's Encrypt TLS
# certificate issued and auto-renewed by Traefik's built-in ACME resolver.
# (Previously sslip.io - switched because some link scanners, e.g.
# LinkedIn's, block sslip.io specifically but accept nip.io.)
#
# Traefik is configured via a HelmChartConfig manifest placed in
# /var/lib/rancher/k3s/server/manifests/traefik-config.yaml on the EC2 box
# (see the Deploy stage in the Jenkinsfile).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: complaint-ingress-ec2
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.tls.certresolver: le
spec:
  rules:
    - host: 3-105-252-57.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: client
                port:
                  number: 8080
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: server
                port:
                  number: 4000
  tls:
    - hosts:
        - 3-105-252-57.nip.io
